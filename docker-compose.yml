version: "3.3"

services:
  # --- Infrastructure (from docker-compose.infra.yml, merged here for convenience) ---
  zookeeper:
    image: docker.io/confluentinc/cp-zookeeper:7.6.1
    container_name: codesight_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: docker.io/confluentinc/cp-kafka:7.6.1
    container_name: codesight_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: docker.io/provectuslabs/kafka-ui:latest
    container_name: codesight_kafka_ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: codesight
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  redis:
    image: docker.io/library/redis:7.2-alpine
    container_name: codesight_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # --- Auth Service ---
  auth_db:
    image: docker.io/library/postgres:16-alpine
    container_name: codesight_auth_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth_service:
    build:
      context: .
      dockerfile: codesight_backend/auth_service/Dockerfile
    container_name: codesight_auth_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${AUTH_DB_USER:-postgres}:${AUTH_DB_PASSWORD:-postgres}@auth_db:5432/${AUTH_DB_NAME:-auth_db}
    depends_on:
      - auth_db

  # --- Analysis Service ---
  analysis_db:
    image: docker.io/library/postgres:16-alpine
    container_name: codesight_analysis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ANALYSIS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ANALYSIS_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${ANALYSIS_DB_NAME:-analysis_db}
    ports:
      - "5434:5432"
    volumes:
      - analysis_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYSIS_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  analysis_service:
    build:
      context: .
      dockerfile: codesight_backend/sast_service/Dockerfile
    container_name: codesight_analysis_service
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      ANALYSIS_DATABASE_URL: postgresql+asyncpg://${ANALYSIS_DB_USER:-postgres}:${ANALYSIS_DB_PASSWORD:-postgres}@analysis_db:5432/${ANALYSIS_DB_NAME:-analysis_db}
      PROJECT_STORAGE_DIR: /tmp/codesight_projects
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - projects_storage:/tmp/codesight_projects
    depends_on:
      - kafka
      - analysis_db

  # --- Security Service ---
  security_db:
    image: docker.io/library/postgres:16-alpine
    container_name: codesight_security_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SECURITY_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${SECURITY_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${SECURITY_DB_NAME:-security_db}
    ports:
      - "5435:5432"
    volumes:
      - security_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SECURITY_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  security_service:
    build:
      context: .
      dockerfile: codesight_backend/security_service/Dockerfile
    container_name: codesight_security_service
    restart: unless-stopped
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      SECURITY_DATABASE_URL: postgresql+asyncpg://${SECURITY_DB_USER:-postgres}:${SECURITY_DB_PASSWORD:-postgres}@security_db:5432/${SECURITY_DB_NAME:-security_db}
      PROJECT_STORAGE_DIR: /tmp/codesight_projects
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - projects_storage:/tmp/codesight_projects
    depends_on:
      - kafka
      - security_db

  # --- Architecture Service ---
  arch_db:
    image: docker.io/library/postgres:16-alpine
    container_name: codesight_arch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ARCH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ARCH_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${ARCH_DB_NAME:-arch_db}
    ports:
      - "5436:5432"
    volumes:
      - arch_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARCH_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  arch_service:
    build:
      context: .
      dockerfile: codesight_backend/arch_service/Dockerfile
    container_name: codesight_arch_service
    restart: unless-stopped
    ports:
      - "8006:8006"
    env_file:
      - .env
    environment:
      ARCH_DATABASE_URL: postgresql+asyncpg://${ARCH_DB_USER:-postgres}:${ARCH_DB_PASSWORD:-postgres}@arch_db:5432/${ARCH_DB_NAME:-arch_db}
      PROJECT_STORAGE_DIR: /tmp/codesight_projects
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ARCHER_URL: http://archer:8009
    volumes:
      - projects_storage:/tmp/codesight_projects
    depends_on:
      - kafka
      - arch_db
      - archer

  # --- Archer (AI architecture advisor) ---
  archer:
    build:
      context: .
      dockerfile: codesight_backend/archer/Dockerfile
    container_name: codesight_archer
    restart: unless-stopped
    ports:
      - "8009:8009"
    env_file:
      - .env

  # --- Loader (проекты на общий volume) ---
  loader_db:
    image: docker.io/library/postgres:16-alpine
    container_name: codesight_loader_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PROJECT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PROJECT_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${PROJECT_DB_NAME:-project_db}
    ports:
      - "5440:5432"
    volumes:
      - loader_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROJECT_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  loader_service:
    build:
      context: .
      dockerfile: codesight_backend/loader_service/Dockerfile
    container_name: codesight_loader_service
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      PROJECT_DATABASE_URL: postgresql+asyncpg://${PROJECT_DB_USER:-postgres}:${PROJECT_DB_PASSWORD:-postgres}@loader_db:5432/${PROJECT_DB_NAME:-project_db}
      PROJECT_STORAGE_DIR: /tmp/codesight_projects
    volumes:
      - projects_storage:/tmp/codesight_projects
    depends_on:
      - loader_db

  # --- Testing ---
  testing_db:
    image: docker.io/library/postgres:16-alpine
    container_name: codesight_testing_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TESTING_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TESTING_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${TESTING_DB_NAME:-testing_db}
    ports:
      - "5437:5432"
    volumes:
      - testing_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TESTING_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  testing_service:
    build:
      context: .
      dockerfile: codesight_backend/testing_service/Dockerfile
    container_name: codesight_testing_service
    restart: unless-stopped
    ports:
      - "8004:8004"
    env_file:
      - .env
    environment:
      TESTING_DATABASE_URL: postgresql+asyncpg://${TESTING_DB_USER:-postgres}:${TESTING_DB_PASSWORD:-postgres}@testing_db:5432/${TESTING_DB_NAME:-testing_db}
      PROJECT_STORAGE_DIR: /tmp/codesight_projects
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - projects_storage:/tmp/codesight_projects
    depends_on:
      - kafka
      - testing_db

  # --- DAST (Valgrind) ---
  dast_db:
    image: docker.io/library/postgres:16-alpine
    container_name: codesight_dast_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DAST_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DAST_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DAST_DB_NAME:-dast_db}
    ports:
      - "5438:5432"
    volumes:
      - dast_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DAST_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dast_service:
    build:
      context: .
      dockerfile: codesight_backend/dast_service/Dockerfile
    container_name: codesight_dast_service
    restart: unless-stopped
    ports:
      - "8008:8008"
    env_file:
      - .env
    environment:
      DAST_DATABASE_URL: postgresql+asyncpg://${DAST_DB_USER:-postgres}:${DAST_DB_PASSWORD:-postgres}@dast_db:5432/${DAST_DB_NAME:-dast_db}
      PROJECT_STORAGE_DIR: /tmp/codesight_projects
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - projects_storage:/tmp/codesight_projects
    depends_on:
      - kafka
      - dast_db

  # --- Orchestrator ---
  orchestrator_db:
    image: docker.io/library/postgres:16-alpine
    container_name: codesight_orchestrator_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORCHESTRATOR_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${ORCHESTRATOR_DB_NAME:-orchestrator_db}
    ports:
      - "5439:5432"
    volumes:
      - orchestrator_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORCHESTRATOR_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator_service:
    build:
      context: .
      dockerfile: codesight_backend/orchestrator_service/Dockerfile
    container_name: codesight_orchestrator_service
    restart: unless-stopped
    ports:
      - "8007:8007"
    env_file:
      - .env
    environment:
      ORCHESTRATOR_DATABASE_URL: postgresql+asyncpg://${ORCHESTRATOR_DB_USER:-postgres}:${ORCHESTRATOR_DB_PASSWORD:-postgres}@orchestrator_db:5432/${ORCHESTRATOR_DB_NAME:-orchestrator_db}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka
      - orchestrator_db

  # --- Frontend (React + nginx) ---
  frontend:
    build:
      context: ./codesight_frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_AUTH_URL: ${REACT_APP_AUTH_URL:-http://localhost:8001}
        REACT_APP_LOADER_URL: ${REACT_APP_LOADER_URL:-http://localhost:8002}
        REACT_APP_SAST_URL: ${REACT_APP_SAST_URL:-http://localhost:8003}
        REACT_APP_TESTING_URL: ${REACT_APP_TESTING_URL:-http://localhost:8004}
        REACT_APP_SECURITY_URL: ${REACT_APP_SECURITY_URL:-http://localhost:8005}
        REACT_APP_ARCH_URL: ${REACT_APP_ARCH_URL:-http://localhost:8006}
        REACT_APP_ORCHESTRATOR_URL: ${REACT_APP_ORCHESTRATOR_URL:-http://localhost:8007}
        REACT_APP_DAST_URL: ${REACT_APP_DAST_URL:-http://localhost:8008}
    container_name: codesight_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - auth_service
      - loader_service
      - analysis_service
      - security_service
      - arch_service
      - testing_service
      - dast_service
      - orchestrator_service

volumes:
  redis_data:
  auth_db_data:
  analysis_db_data:
  security_db_data:
  arch_db_data:
  loader_db_data:
  testing_db_data:
  dast_db_data:
  orchestrator_db_data:
  projects_storage:
