version: "3.3"

services:
  # --- Infrastructure (from docker-compose.infra.yml, merged here for convenience) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: codesight_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: codesight_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: codesight_kafka_ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: codesight
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  redis:
    image: redis:7.2-alpine
    container_name: codesight_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # --- Auth Service ---
  auth_db:
    image: postgres:16-alpine
    container_name: codesight_auth_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth_service:
    build:
      context: .
      dockerfile: codesight_backend/auth_service/Dockerfile
    container_name: codesight_auth_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${AUTH_DB_USER:-postgres}:${AUTH_DB_PASSWORD:-postgres}@auth_db:5432/${AUTH_DB_NAME:-auth_db}
    depends_on:
      auth_db:
        condition: service_healthy

  # --- Analysis Service ---
  analysis_db:
    image: postgres:16-alpine
    container_name: codesight_analysis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ANALYSIS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ANALYSIS_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${ANALYSIS_DB_NAME:-analysis_db}
    ports:
      - "5434:5432"
    volumes:
      - analysis_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYSIS_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  analysis_service:
    build:
      context: .
      dockerfile: codesight_backend/analysis_service/Dockerfile
    container_name: codesight_analysis_service
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      ANALYSIS_DATABASE_URL: postgresql+asyncpg://${ANALYSIS_DB_USER:-postgres}:${ANALYSIS_DB_PASSWORD:-postgres}@analysis_db:5432/${ANALYSIS_DB_NAME:-analysis_db}
      # Общий volume с loader_service, чтобы видеть распакованные проекты
      PROJECT_STORAGE_DIR: /tmp/codesight_projects
    volumes:
      - projects_storage:/tmp/codesight_projects
    depends_on:
      analysis_db:
        condition: service_healthy

  # --- Security Service ---
  security_db:
    image: postgres:16-alpine
    container_name: codesight_security_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SECURITY_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${SECURITY_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${SECURITY_DB_NAME:-security_db}
    ports:
      - "5435:5432"
    volumes:
      - security_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SECURITY_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  security_service:
    build:
      context: .
      dockerfile: codesight_backend/security_service/Dockerfile
    container_name: codesight_security_service
    restart: unless-stopped
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      SECURITY_DATABASE_URL: postgresql+asyncpg://${SECURITY_DB_USER:-postgres}:${SECURITY_DB_PASSWORD:-postgres}@security_db:5432/${SECURITY_DB_NAME:-security_db}
      PROJECT_STORAGE_DIR: /tmp/codesight_projects
    volumes:
      - projects_storage:/tmp/codesight_projects
    depends_on:
      security_db:
        condition: service_healthy

  # --- Architecture Service ---
  arch_db:
    image: postgres:16-alpine
    container_name: codesight_arch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ARCH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ARCH_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${ARCH_DB_NAME:-arch_db}
    ports:
      - "5436:5432"
    volumes:
      - arch_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARCH_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  arch_service:
    build:
      context: .
      dockerfile: codesight_backend/arch_service/Dockerfile
    container_name: codesight_arch_service
    restart: unless-stopped
    ports:
      - "8006:8006"
    env_file:
      - .env
    environment:
      ARCH_DATABASE_URL: postgresql+asyncpg://${ARCH_DB_USER:-postgres}:${ARCH_DB_PASSWORD:-postgres}@arch_db:5432/${ARCH_DB_NAME:-arch_db}
    depends_on:
      arch_db:
        condition: service_healthy

volumes:
  redis_data:
  auth_db_data:
  analysis_db_data:
  security_db_data:
  arch_db_data:
  projects_storage:
