server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Без этого браузер часто держит старый index.html и подгружает прежние
  # hashed-chunks — UI «не совпадает с кодом» после podman-compose --build.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /healthz {
    access_log off;
    return 200 "ok";
    add_header Content-Type text/plain;
  }
}
